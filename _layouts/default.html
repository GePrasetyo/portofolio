<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <!-- Share preview (WhatsApp, LinkedIn, Slack…). `image` in each page's front matter picks the thumbnail. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}?v={{ site.asset_version }}" type="image/svg+xml">
  <script>document.documentElement.className+=' js';try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.asset_version }}">
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">Dhimas Prasetyo <small>Game Developer</small></a>
    <nav class="nav-links" aria-label="Primary">
      <a href="{{ '/#work' | relative_url }}">Work</a>
      <a href="{{ '/#experience' | relative_url }}">Experience</a>
      <a href="{{ '/#skills' | relative_url }}">Skills</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
      <a class="cta" href="{{ '/assets/doc/Dhimas_Prasetyo_CV.pdf' | relative_url }}" target="_blank" rel="noopener">Résumé</a>
      <button class="theme-btn" type="button" aria-label="Toggle dark mode">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>

{{ content }}

<footer class="footer">
  <div class="wrap">
    <span>© 2026 Dhimas Prasetyo</span>
  </div>
</footer>

<script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
</body>
</html>
