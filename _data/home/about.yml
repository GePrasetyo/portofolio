facts:
  title: Quick facts
  cut: d
  items:
    - label: Location
      text: "**Stockholm, Sweden.** Swedish permanent resident, so no visa sponsorship needed. Originally from Jakarta, three years in Singapore in between."
    - label: Looking for
      text: Lead, senior gameplay or multiplayer roles. Any platform, Unity or Unreal. On-site in Stockholm, hybrid, or remote.
    - label: Working style
      text: I build editor tools so designers and artists can keep working without waiting on a programmer.
    - label: Leading
      text: I keep estimates realistic and say early when something won't make it. Before a task starts, the team agrees on what done looks like.
    - label: Lately
      text: Building automation that runs tests and investigates logs, and using Claude to playtest builds and triage crash reports.
    - label: Elsewhere
      text: "[LinkedIn](https://www.linkedin.com/in/dhimasgprasetyo/), [GitHub](https://github.com/GePrasetyo), and [Instagram](https://www.instagram.com/majingari/) as majingari."
